server:
  port: 8080

spring:
  application:
    name: student-management
  datasource:
    url: jdbc:h2:file:./data/student-management
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    web:
      pageable:
        max-page-size: 100

catalog:
  base-url: http://localhost:${server.port}/stub/catalog
  connect-timeout: 1s
  read-timeout: 2s
  stub:
    enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:4200
